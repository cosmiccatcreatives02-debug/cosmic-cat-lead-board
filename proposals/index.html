function pkgGroups(pkg){return[['Creative scope',pkg.scope],['Brand assets',pkg.brandAsset],['Deliverables',pkg.deliverables],['Business kit',pkg.businessKit],['Post-sale support',pkg.postSale]].filter(g=>g[1]&&g[1].length).map(([label,items])=>({label,items:items.slice()}))}
function itemGroups(item){if(item.groups&&item.groups.length)return item.groups;if(item.kind==='package'&&item.refId){const pkg=settings.tier1.concat(settings.tier2).find(x=>x.id===item.refId);if(pkg)return pkgGroups(pkg)}return item.inclusions&&item.inclusions.length?[{label:'Includes',items:item.inclusions}]:[]}
function scopeOutlineHTML(item){const gs=itemGroups(item);if(!gs.length)return'';return`<div class="pp-scope">${gs.map(g=>`<div class="pp-scope-g"><div class="pp-scope-h">${esc(g.label)}</div><ul>${g.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div>`).join('')}</div>`}
function payAccounts(){return lines(settings.paymentDetails).map(l=>{const p=l.split('|').map(s=>s.trim());if(p.length>=2)return{method:p[0],name:p[1]||'',number:p[2]||''};const i=l.indexOf(': ');return{method:i>0?l.slice(0,i):l,name:'',number:i>0?l.slice(i+2):''}})}
function termsListHTML(ls){return`<ol class="pp-terms">${ls.map(l=>{const i=l.indexOf(': ');return i>0&&i<45?`<li class="avoid-break"><strong>${esc(l.slice(0,i))}.</strong> ${esc(l.slice(i+2))}</li>`:`<li class="avoid-break">${esc(l)}</li>`}).join('')}</ol>`}
function payDetailsHTML(){const a=payAccounts();if(!a.length)return'';return`<div class="pp-pay avoid-break"><div class="pp-label">Payment details</div><div class="pp-pay-grid">${a.map(x=>`<div class="pp-pay-card"><div class="pp-pay-m">${esc(x.method)}</div>${x.name?`<div class="pp-pay-r"><span>Account name</span><b>${esc(x.name)}</b></div>`:''}${x.number?`<div class="pp-pay-r"><span>${/gcash/i.test(x.method)?'Number':'Account no.'}</span><b>${esc(x.number)}</b></div>`:''}</div>`).join('')}</div></div>`}
function proposalPaperHTML(p){const b=settings.business;const t=totals(p);const validDate=fmtDate(addDays(p.date,num(p.validDays)));const tierLabel=p.type==='tier2'?'Tier 2 (SME)':p.type==='bespoke'?'Bespoke':'Tier 1';let h=`<div class="paper-header"><div class="paper-header-left"><img src="${LOGO}" alt="Cosmic Cat" style="width:52px;height:52px;display:block"><div><h1>PROPOSAL</h1><div style="font-size:11px;color:#888">${esc(b.tagline)}</div></div></div><div class="paper-right"><strong>${esc(p.number)}</strong><div>${fmtDate(p.date)}</div><div>Valid until ${validDate}</div><div style="margin-top:4px;font-size:10px;padding:2px 8px;background:#f0f0f2;border-radius:4px;display:inline-block">${tierLabel}</div></div></div>`;
h+=`<div class="pp-cols avoid-break"><div class="pp-col"><div class="pp-label">Prepared for</div><div class="pp-strong">${esc(p.client.business||p.client.name)}</div>${p.client.business&&p.client.name?`<div>${esc(p.client.name)}</div>`:''}${p.client.contact?`<div style="font-size:12px;color:#888">${esc(p.client.contact)}</div>`:''}</div><div class="pp-col"><div class="pp-label">Prepared by</div><div class="pp-strong">${esc(p.preparedBy||b.name)}</div>${p.preparedBy?`<div>${esc(b.name)}</div>`:''}</div></div>`;
if(p.intro)h+=`<p class="avoid-break" style="margin-bottom:16px">${esc(p.intro)}</p>`;
if(p.items.length){h+=`<h2>Scope and investment</h2><table class="pp-table"><thead><tr><th>Description</th><th class="tr">Qty</th><th class="tr">Amount</th></tr></thead><tbody>`;p.items.forEach(item=>{const incl=scopeOutlineHTML(item);const dl=lines(item.description);const desc=dl.length>1?`<ul class="pp-desc">${dl.map(l=>`<li>${esc(l.replace(/^[-•*]\s*/,''))}</li>`).join('')}</ul>`:dl.length?`<div class="pp-desc">${esc(dl[0])}</div>`:'';const more=incl||desc;h+=`<tr class="avoid-break pp-item${more?' has-more':''}"><td><strong>${esc(item.name)}</strong></td><td class="tr">${num(item.qty)}</td><td class="tr">${peso(num(item.price)*num(item.qty))}</td></tr>`;if(more)h+=`<tr class="pp-item-more"><td colspan="3">${incl}${desc}</td></tr>`});h+=`</tbody></table><div class="avoid-break">`;h+=`<div class="pp-sub-row"><span>Subtotal</span><span>${peso(t.sub)}</span></div>`;if(t.disc>0)h+=`<div class="pp-sub-row discount"><span>Discount</span><span>-${peso(t.disc)}</span></div>`;h+=`<div class="pp-total-box"><span>Total investment</span><span>${peso(t.total)}</span></div>`;if(num(p.downpaymentPct)>0&&num(p.downpaymentPct)<100){h+=`<div class="pp-sub-row"><span>To start (${num(p.downpaymentPct)}%)</span><span>${peso(t.dp)}</span></div>`;h+=`<div class="pp-sub-row"><span>Balance</span><span>${peso(t.bal)}</span></div>`}h+=`</div>`}
const tl=lines(p.timeline);if(tl.length){h+=`<h2>How we'll work</h2><ol class="pp-steps">`;tl.forEach(l=>h+=`<li>${esc(l)}</li>`);h+=`</ol>`}
h+=payDetailsHTML();const tm=lines(termsFor(p));if(tm.length){h+=`<h2>Terms and conditions</h2>`+termsListHTML(tm)}
h+=`<div class="pp-sig avoid-break">${clientSigHTML(p.client.name,'Client signature over printed name \u00B7 Date')}${ownerSigHTML()}</div>`;
h+=footerHTML();
return h}

function invoicePaperHTML(inv){const b=settings.business;const t=invoiceTotals(inv);const dueDate=fmtDate(addDays(inv.date,num(inv.dueDays)));const isOverdue=inv.status!=='paid'&&addDays(inv.date,num(inv.dueDays))<todayISO();let h=`<div class="paper-header"><div class="paper-header-left"><img src="${LOGO}" alt="Cosmic Cat" style="width:52px;height:52px;display:block"><div><h1>INVOICE</h1><div style="font-size:11px;color:#888">${esc(b.tagline)}</div></div></div><div class="paper-right"><strong>${esc(inv.number)}</strong><div>Date: ${fmtDate(inv.date)}</div><div${isOverdue?' style="color:#ef4444;font-weight:600"':''}>Due: ${dueDate}${isOverdue?' (OVERDUE)':''}</div>${inv.proposalNumber?`<div style="font-size:11px;color:#888;margin-top:2px">Ref: ${esc(inv.proposalNumber)}</div>`:''}</div></div>`;
h+=`<div class="pp-cols avoid-break"><div class="pp-col"><div class="pp-label">Bill to</div><div class="pp-strong">${esc(inv.client.business||inv.client.name)}</div>${inv.client.business&&inv.client.name?`<div>${esc(inv.client.name)}</div>`:''}${inv.client.contact?`<div style="font-size:12px;color:#888">${esc(inv.client.contact)}</div>`:''}</div><div class="pp-col"><div class="pp-label">From</div><div class="pp-strong">${esc(b.name)}</div><div>${esc(inv.preparedBy||settings.defaults.preparedBy)}</div></div></div>`;
if(inv.items.length){h+=`<table class="pp-table"><thead><tr><th>Description</th><th class="tr">Qty</th><th class="tr">Amount</th></tr></thead><tbody>`;inv.items.forEach(item=>{h+=`<tr class="avoid-break"><td>${esc(item.name)}</td><td class="tr">${num(item.qty)}</td><td class="tr">${peso(num(item.price)*num(item.qty))}</td></tr>`});h+=`</tbody></table><div class="avoid-break">`;h+=`<div class="pp-sub-row"><span>Subtotal</span><span>${peso(t.sub)}</span></div>`;if(t.disc>0)h+=`<div class="pp-sub-row discount"><span>Discount</span><span>-${peso(t.disc)}</span></div>`;h+=`<div class="pp-total-box"><span>Total due</span><span>${peso(t.total)}</span></div></div>`}
if(inv.payments&&inv.payments.length){h+=`<h2>Payment history</h2><div class="pp-payment-hist">`;inv.payments.forEach(pay=>{h+=`<div class="pp-payment-row"><span>${shortDate(pay.date)} — ${esc(pay.method)}${pay.reference?' #'+esc(pay.reference):''}</span><span>${peso(pay.amount)}</span></div>`});h+=`</div><div class="pp-total-box" style="background:${t.balance<=0?'#10b981':'#f59e0b'}"><span>Balance</span><span>${peso(Math.max(t.balance,0))}</span></div>`}
h+=payDetailsHTML();const tm=lines(invoiceTermsFor(inv));if(tm.length){h+=`<h2>Terms</h2>`+termsListHTML(tm)}h+=`<div class="pp-sig avoid-break"><div class="pp-sig-col"></div>${ownerSigHTML()}</div>`;

h+=footerHTML();return h}

function receiptPaperHTML(r){const b=settings.business;let h=`<div class="paper-header"><div class="paper-header-left"><img src="${LOGO}" alt="Cosmic Cat" style="width:52px;height:52px;display:block"><div><h1>ACKNOWLEDGEMENT RECEIPT</h1><div style="font-size:11px;color:#888">${esc(b.tagline)}</div></div></div><div class="paper-right"><strong>${esc(r.number)}</strong><div>${fmtDate(r.date)}</div>${r.invoiceNumber?`<div style="font-size:11px;color:#888">Ref: ${esc(r.invoiceNumber)}</div>`:''}</div></div>`;
h+=`<div class="pp-cols avoid-break"><div class="pp-col"><div class="pp-label">Received from</div><div class="pp-strong">${esc(r.client.business||r.client.name)}</div>${r.client.business&&r.client.name?`<div>${esc(r.client.name)}</div>`:''}</div></div>`;
h+=`<div class="pp-receipt-box avoid-break"><div class="pp-label" style="margin-bottom:8px">Amount received</div><div class="pp-receipt-amount">${peso(r.amount)}</div><div style="margin-top:8px;font-size:13px"><strong>Payment method:</strong> ${esc(r.method)}<br>${r.reference?`<strong>Reference no:</strong> ${esc(r.reference)}<br>`:''}</div></div>`;
if(r.purpose)h+=`<div class="avoid-break" style="margin-bottom:16px"><div class="pp-label">Purpose</div><div>${esc(r.purpose)}</div></div>`;
h+=`<div class="pp-cols avoid-break" style="margin-top:24px"><div class="pp-col"><div class="pp-label">Received by</div><div class="pp-strong">${esc(r.receivedBy||settings.defaults.preparedBy)}</div><div>${esc(b.name)}</div></div></div>`;
if(settings.defaults.receiptNote)h+=`<div class="avoid-break" style="font-size:11px;color:#777;margin-top:16px">${esc(settings.defaults.receiptNote)}</div>`;h+=`<div class="pp-sig avoid-break">${ownerSigHTML()}${clientSigHTML(r.client.name,'Client acknowledgement \u00B7 Date')}</div>`;
h+=footerHTML();return h}

function messengerText(p){const b=settings.business;const t=totals(p);const validDate=fmtDate(addDays(p.date,num(p.validDays)));let m=`Hi ${p.client.name||'there'}! 👋\n\nThank you for your interest in ${b.name}. Here's your proposal (${p.number}):\n\n📋 SCOPE & INVESTMENT\n`;(p.items||[]).forEach(i=>{m+=`• ${i.name} — ${peso(num(i.price)*num(i.qty))}\n`;itemGroups(i).forEach(g=>{m+=`   ${g.label}: ${g.items.join(', ')}\n`})});m+=`\n`;if(t.disc>0)m+=`💰 Discount: -${peso(t.disc)}\n`;m+=`💰 Total: ${peso(t.total)}\n`;if(num(p.downpaymentPct)>0&&num(p.downpaymentPct)<100){m+=`▸ To start (${num(p.downpaymentPct)}%): ${peso(t.dp)}\n`;m+=`▸ Balance: ${peso(t.bal)}\n`}m+=`\n📌 HOW WE'LL WORK\n`;lines(p.timeline).forEach((l,i)=>m+=`${i+1}. ${l}\n`);m+=`\n📝 TERMS\n`;lines(termsFor(p)).forEach(l=>m+=`• ${l}\n`);m+=`\nThis proposal is valid until ${validDate}.\n\nLet me know if you have any questions or if you'd like to proceed! 😊\n\n— ${p.preparedBy||b.name}\n${b.name}`;return m}


/* ---------- activity log ---------- */
const LOG_ICONS={created:'✨',duplicated:'📋',status:'🔁',edited:'✏️',deleted:'🗑',payment:'💰',receipt:'🧾',pdf:'📥',print:'🖨',messenger:'💬',settings:'⚙️',signin:'🔓',signout:'🔒'};
let activity=[],aFilter='all';const lastEditLog={};
function userName(){if(!currentUser)return 'Someone';const em=(currentUser.email||'').trim().toLowerCase();const mapped=(window.TEAM_NAMES||{})[em];if(currentUser.displayName)return currentUser.displayName;if(mapped)return mapped;const stem=em.split('@')[0].replace(/[._-]+/g,' ').trim();return stem?stem.charAt(0).toUpperCase()+stem.slice(1):'Someone'}
function logActivity(kind,docType,doc,text,extra){const e={id:uid('log'),ts:new Date().toISOString(),kind,docType,docId:(doc&&doc.id)||'',docNumber:(doc&&doc.number)||'',client:doc&&doc.client?(doc.client.business||doc.client.name||''):'',text,user:userName(),userEmail:(currentUser&&currentUser.email)||'',relatedId:(extra&&extra.relatedId)||''};activity.unshift(e);let saved=null;if(store&&store.saveActivity){saved=store.saveActivity(e);if(saved&&saved.catch)saved.catch(()=>{})}refreshActivityViews();return saved}
function logEdit(docType,doc){if(!doc)return;const now=Date.now();if(lastEditLog[doc.id]&&now-lastEditLog[doc.id]<10*60*1000)return;lastEditLog[doc.id]=now;logActivity('edited',docType,doc,'Edited '+docType)}
function setStatus(kind,val){const d=kind==='proposal'?pDraft:iDraft;if(!d||d.status===val)return;const old=d.status;d.status=val;logActivity('status',kind,d,'Status changed: '+old+' → '+val,{relatedId:kind==='invoice'?d.proposalId:''});touched()}
function fmtWhen(ts){try{return new Date(ts).toLocaleString('en-PH',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}catch{return ''}}
function fmtTime(ts){try{return new Date(ts).toLocaleTimeString('en-PH',{hour:'numeric',minute:'2-digit'})}catch{return ''}}
function logRowHTML(e,full){const icon=LOG_ICONS[e.kind]||'•';const link=e.docNumber&&(full||e.docType)?`<span class="log-doc" onclick="openDoc('${esc(e.docType)}','${esc(e.docId)}')">${esc(e.docNumber)}</span> · `:'';return`<div class="log-row"><div class="log-ico">${icon}</div><div class="log-main"><div>${link}${esc(e.text)}</div><div class="log-meta">${esc(e.user)} · ${full?fmtTime(e.ts):fmtWhen(e.ts)}${full&&e.client?' · '+esc(e.client):''}</div></div></div>`}
function threadHTML(docId){const list=activity.filter(e=>docId&&(e.docId===docId||e.relatedId===docId));if(!list.length)return'<div style="font-size:12px;color:var(--tx3)">No activity yet</div>';return list.map(e=>logRowHTML(Object.assign({},e,e.docId===docId?{docNumber:''}:{}),false)).join('')}
function currentDocId(){return mod==='proposals'?pCurrent:mod==='invoices'?iCurrent:mod==='receipts'?rCurrent:null}
function refreshActivityViews(){if(mod==='activity'){if(!sidebarBusy())renderSidebar();renderActivityView();return}const t=document.getElementById('docThread');if(t)t.innerHTML=threadHTML(currentDocId())}
function renderActivitySidebar(el){const today=new Date().toDateString();const todays=activity.filter(e=>new Date(e.ts).toDateString()===today);const people=new Set(todays.map(e=>e.user)).size;const filters=[['all','All'],['proposal','Proposals'],['invoice','Invoices'],['receipt','Receipts'],['settings','Settings'],['session','Sign-ins']];el.innerHTML=`<div class="stats" style="padding-top:12px"><div class="stat"><div class="stat-n">${todays.length}</div><div class="stat-l">Today</div></div><div class="stat"><div class="stat-n">${people}</div><div class="stat-l">Active</div></div><div class="stat"><div class="stat-n">${activity.length}</div><div class="stat-l">Logged</div></div></div><div class="ssearch"><input placeholder="Search number, client, person…" value="${esc(sQuery)}" oninput="sQuery=this.value;renderActivityView()"></div><div class="sfilter">${filters.map(([k,l])=>`<button class="chip${aFilter===k?' on':''}" onclick="aFilter='${k}';renderSidebar();renderActivityView()">${l}</button>`).join('')}</div>`}
function renderActivityView(){const el=document.getElementById('activityView');if(!el)return;let list=activity;if(aFilter!=='all')list=list.filter(e=>e.docType===aFilter);if(sQuery){const q=sQuery.toLowerCase();list=list.filter(e=>((e.docNumber||'')+' '+(e.client||'')+' '+(e.user||'')+' '+(e.text||'')).toLowerCase().includes(q))}if(!list.length){el.innerHTML='<div class="empty-state">No activity yet. New proposals, status changes, payments, PDFs and sign-ins will show up here.</div>';return}let html='',day='';const todayStr=new Date().toDateString();list.forEach(e=>{const d=new Date(e.ts);const label=d.toDateString()===todayStr?'Today':d.toLocaleDateString('en-PH',{weekday:'long',month:'long',day:'numeric'});if(label!==day){day=label;html+=`<div class="log-day">${label}</div>`}html+=logRowHTML(e,true)});el.innerHTML=html}
function openDoc(type,id){const map={proposal:['proposals',proposals,selectProposal],invoice:['invoices',invoices,selectInvoice],receipt:['receipts',receipts,selectReceipt]};const m=map[type];if(!m)return;if(!m[1].some(x=>x.id===id)){toast('That document was deleted');return}if(dirty)saveNow();mod=m[0];sFilter='all';sQuery='';history.replaceState(null,'','#'+mod);m[2](id)}
document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('.pitem'))document.getElementById('sidebar').classList.remove('open')});

/* ---------- A4 pages: content flows onto as many pages as it needs ---------- */
const A4={w:794,h:1123,top:52,side:56,bottom:84};
function buildPages(html,opts){opts=opts||{};const tmp=document.createElement('div');tmp.innerHTML=html;let footInner='';const f=tmp.querySelector(':scope > .pp-footer');if(f){footInner=f.innerHTML;f.remove()}const blocks=[...tmp.children];
const host=document.createElement('div');host.style.cssText='position:fixed;left:-20000px;top:0;visibility:hidden';document.body.appendChild(host);
const limit=A4.h-A4.top-A4.bottom;const pages=[];let body;
const newPage=()=>{const pg=document.createElement('div');pg.className='paper a4-page'+(opts.print?' paper-print':'');pg.innerHTML='<div class="a4-body"></div>';host.appendChild(pg);body=pg.firstChild;pages.push(pg)};
const fits=()=>body.scrollHeight<=limit+1;
const moveHeadingAlong=()=>{const prev=body.lastElementChild;if(prev&&/^H[1-3]$/.test(prev.tagName)&&body.children.length>1){prev.remove();newPage();body.appendChild(prev);return true}if(body.children.length){newPage();return true}return false};
const splitTable=tbl=>{const thead=tbl.tHead;const rows=[...tbl.tBodies[0].rows];const groups=[];rows.forEach(r=>{if(r.classList.contains('pp-item-more')&&groups.length)groups[groups.length-1].push(r);else groups.push([r])});
 const freshTable=()=>{const t=tbl.cloneNode(false);if(thead)t.appendChild(thead.cloneNode(true));const tb=document.createElement('tbody');t.appendChild(tb);body.appendChild(t);return tb};
 let tb=freshTable();
 groups.forEach(g=>{g.forEach(r=>tb.appendChild(r));if(fits())return;g.forEach(r=>r.remove());if(!tb.rows.length){tb.parentNode.remove();moveHeadingAlong()}else newPage();tb=freshTable();g.forEach(r=>tb.appendChild(r))});
 if(!tb.rows.length)tb.parentNode.remove()};
newPage();
blocks.forEach(el=>{body.appendChild(el);if(fits())return;if(el.tagName==='TABLE'&&el.tBodies.length){el.remove();splitTable(el);return}el.remove();moveHeadingAlong();body.appendChild(el)});
const n=pages.length;pages.forEach((pg,i)=>{const ft=document.createElement('div');ft.className='a4-foot';ft.innerHTML=`<div class="a4-foot-c">${footInner}</div>${n>1?`<div class="a4-pg">Page ${i+1} of ${n}</div>`:''}`;pg.appendChild(ft)});
const out=pages.map(p=>p.outerHTML);host.remove();return out}
function showPages(el,html,after){const pages=buildPages(html);el.innerHTML=`<div class="pages" id="paperSlot">${pages.join('')}</div>${after||''}`;fitPages()}
function fitPages(){const w=document.getElementById('paperSlot');const pv=document.getElementById('preview');if(!w||!pv)return;const avail=pv.clientWidth-40;const z=Math.min(1,Math.max(.3,avail/A4.w));w.style.zoom=z}
window.addEventListener('resize',()=>fitPages());
function renderAll(){renderTabs();renderSidebar();renderBar();renderContent()}
function renderTabs(){document.getElementById('tcProp').textContent=proposals.length?' '+proposals.length:'';document.getElementById('tcInv').textContent=invoices.length?' '+invoices.length:'';document.getElementById('tcRec').textContent=receipts.length?' '+receipts.length:'';document.querySelectorAll('.tab[data-mod]').forEach(t=>{t.classList.toggle('on',t.dataset.mod===mod)})}
function renderSidebar(){const el=document.getElementById('sidebar');if(mod==='activity'){renderActivitySidebar(el);return}if(mod==='settings'){el.innerHTML=`<div class="empty-state" style="padding:20px;font-size:13px">Manage your packages, collaterals, payment methods, and business details.</div>`;return}if(mod==='proposals')renderProposalSidebar(el);else if(mod==='invoices')renderInvoiceSidebar(el);else if(mod==='receipts')renderReceiptSidebar(el)}

function renderProposalSidebar(el){const stats=proposals.reduce((a,p)=>{a[p.status]=(a[p.status]||0)+1;return a},{});const wr=stats.accepted&&(stats.accepted+(stats.declined||0))?Math.round(100*stats.accepted/(stats.accepted+(stats.declined||0)))+'%':'—';let list=proposals.slice().sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''));if(sFilter!=='all')list=list.filter(p=>p.status===sFilter);if(sQuery){const q=sQuery.toLowerCase();list=list.filter(p=>(p.number+' '+p.client.name+' '+p.client.business).toLowerCase().includes(q))}el.innerHTML=`<div class="snew"><button class="primary" onclick="createProposal()">+ New proposal</button></div><div class="stats"><div class="stat"><div class="stat-n">${stats.sent||0}</div><div class="stat-l">Sent</div></div><div class="stat"><div class="stat-n">${stats.accepted||0}</div><div class="stat-l">Won</div></div><div class="stat"><div class="stat-n">${wr}</div><div class="stat-l">Win rate</div></div></div><div class="ssearch"><input placeholder="Search proposals…" value="${esc(sQuery)}" oninput="sQuery=this.value;renderSidebar()"></div><div class="sfilter">${['all','draft','sent','accepted','declined'].map(s=>`<button class="chip${sFilter===s?' on':''}" onclick="sFilter='${s}';renderSidebar()">${s}</button>`).join('')}</div><div class="slist">${list.map(p=>`<button class="pitem${p.id===pCurrent?' on':''}" onclick="selectProposal('${p.id}')"><div class="pitem-num">${esc(p.number)}</div><div class="pitem-name">${esc(p.client.business||p.client.name||'Untitled')}</div><div class="pitem-meta"><span class="dot dot-${p.status}"></span>${p.status} · ${pesoShort(totals(p).total)}</div></button>`).join('')}${!list.length?'<div class="empty-state">No proposals yet</div>':''}</div>`}

function renderInvoiceSidebar(el){const stats=invoices.reduce((a,i)=>{a[i.status]=(a[i.status]||0)+1;return a},{});const outstanding=invoices.filter(i=>i.status!=='paid').reduce((s,i)=>s+invoiceTotals(i).balance,0);let list=invoices.slice().sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''));if(sFilter!=='all')list=list.filter(i=>i.status===sFilter);if(sQuery){const q=sQuery.toLowerCase();list=list.filter(i=>(i.number+' '+i.client.name+' '+i.client.business).toLowerCase().includes(q))}el.innerHTML=`<div class="snew"><button class="primary" onclick="createInvoice()">+ New invoice</button></div><div class="stats"><div class="stat"><div class="stat-n">${stats.unpaid||0}</div><div class="stat-l">Unpaid</div></div><div class="stat"><div class="stat-n">${stats.partial||0}</div><div class="stat-l">Partial</div></div><div class="stat"><div class="stat-n">${pesoShort(outstanding)}</div><div class="stat-l">Outstanding</div></div></div><div class="ssearch"><input placeholder="Search invoices…" value="${esc(sQuery)}" oninput="sQuery=this.value;renderSidebar()"></div><div class="sfilter">${['all','unpaid','partial','paid'].map(s=>`<button class="chip${sFilter===s?' on':''}" onclick="sFilter='${s}';renderSidebar()">${s}</button>`).join('')}</div><div class="slist">${list.map(inv=>{const t=invoiceTotals(inv);const overdue=inv.status!=='paid'&&addDays(inv.date,num(inv.dueDays))<todayISO();return`<button class="pitem${inv.id===iCurrent?' on':''}" onclick="selectInvoice('${inv.id}')"><div class="pitem-num">${esc(inv.number)}</div><div class="pitem-name">${esc(inv.client.business||inv.client.name||'Untitled')}</div><div class="pitem-meta"><span class="dot dot-${overdue?'overdue':inv.status}"></span>${overdue?'overdue':inv.status} · ${pesoShort(t.balance>0?t.balance:t.total)}</div></button>`}).join('')}${!list.length?'<div class="empty-state">No invoices yet</div>':''}</div>`}

function renderReceiptSidebar(el){const total=receipts.reduce((s,r)=>s+num(r.amount),0);let list=receipts.slice().sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));if(sQuery){const q=sQuery.toLowerCase();list=list.filter(r=>(r.number+' '+r.client.name+' '+r.client.business).toLowerCase().includes(q))}el.innerHTML=`<div class="snew" style="padding-top:16px"><div style="font-size:13px;color:var(--tx2);padding:4px 0">Receipts are created when you record a payment on an invoice.</div></div><div class="stats"><div class="stat"><div class="stat-n">${receipts.length}</div><div class="stat-l">Total</div></div><div class="stat" style="grid-column:span 2"><div class="stat-n">${pesoShort(total)}</div><div class="stat-l">Collected</div></div></div><div class="ssearch"><input placeholder="Search receipts…" value="${esc(sQuery)}" oninput="sQuery=this.value;renderSidebar()"></div><div class="slist">${list.map(r=>`<button class="pitem${r.id===rCurrent?' on':''}" onclick="selectReceipt('${r.id}')"><div class="pitem-num">${esc(r.number)}</div><div class="pitem-name">${esc(r.client.business||r.client.name||'—')}</div><div class="pitem-meta">${peso(r.amount)} · ${esc(r.method)} · ${shortDate(r.date)}</div></button>`).join('')}${!list.length?'<div class="empty-state">No receipts yet</div>':''}</div>`}

function renderBar(){const el=document.getElementById('wsbar');if(mod==='activity'){el.innerHTML='<span class="wssave">Everything your team does, newest first</span>';return}if(mod==='proposals'){if(!pDraft){el.innerHTML='';return}const t=totals(pDraft);el.innerHTML=`<button class="btn btn-outline toggle-view" onclick="showPreview=!showPreview;renderContent();fitPages()">${showPreview?'✏️ Edit':'👁 Preview'}</button><select id="statusSel" onchange="setStatus('proposal',this.value)">${['draft','sent','accepted','declined'].map(s=>`<option value="${s}"${pDraft.status===s?' selected':''}>${s}</option>`).join('')}</select><span class="wstotal">${peso(t.total)}</span><span class="wssave">${dirty?'Editing…':'Saved'}</span><span class="spacer"></span>${pDraft.status==='accepted'?`<button class="btn btn-green btn-sm" onclick="createInvoice(pDraft)">📄 Create Invoice</button>`:''}<button class="btn btn-outline btn-sm" onclick="openMessenger()">💬 Messenger</button><button class="btn btn-blue btn-sm" onclick="downloadPdf('proposal')">📥 PDF</button><button class="btn btn-outline btn-sm" onclick="printDoc()">🖨 Print</button><button class="btn btn-outline btn-sm" onclick="duplicateProposal()">📋</button><button class="btn btn-outline btn-sm" onclick="confirmDelete('proposal')">🗑</button>`}else if(mod==='invoices'){if(!iDraft){el.innerHTML='';return}const t=invoiceTotals(iDraft);el.innerHTML=`<button class="btn btn-outline toggle-view" onclick="showPreview=!showPreview;renderContent();fitPages()">${showPreview?'✏️ Edit':'👁 Preview'}</button><select onchange="setStatus('invoice',this.value)">${['unpaid','partial','paid'].map(s=>`<option value="${s}"${iDraft.status===s?' selected':''}>${s}</option>`).join('')}</select><span class="wstotal">${peso(t.total)}</span><span class="wssave">${dirty?'Editing…':'Saved'}</span><span class="spacer"></span>${iDraft.status!=='paid'?`<button class="btn btn-green btn-sm" onclick="openPaymentModal()">💰 Record Payment</button>`:''}<button class="btn btn-blue btn-sm" onclick="downloadPdf('invoice')">📥 PDF</button><button class="btn btn-outline btn-sm" onclick="printDoc()">🖨 Print</button><button class="btn btn-outline btn-sm" onclick="confirmDelete('invoice')">🗑</button>`}else if(mod==='receipts'){if(!rCurrent){el.innerHTML='';return}el.innerHTML=`<span class="wssave">Receipt</span><span class="spacer"></span><button class="btn btn-outline btn-sm" onclick="openReceiptEdit()">✏️ Edit payment details</button><button class="btn btn-blue btn-sm" onclick="downloadPdf('receipt')">📥 PDF</button><button class="btn btn-outline btn-sm" onclick="printDoc()">🖨 Print</button>`}else if(mod==='settings'){el.innerHTML=`<span class="wssave">Manage packages, collaterals, and business details</span><span class="spacer"></span><button class="btn btn-brand btn-sm" onclick="saveCatalog()">Save changes</button><button class="btn btn-outline btn-sm" onclick="renderContent()">Discard</button>`}}

function renderContent(){const el=document.getElementById('wscontent');el.className='wscontent'+(showPreview?' show-preview':'');if(mod==='activity'){el.innerHTML='<div class="activity-view" id="activityView"></div>';renderActivityView();return}if(mod==='proposals'){if(!pDraft){el.innerHTML='<div class="empty-state">Select a proposal or create a new one</div>';return}el.innerHTML='<div class="editor" id="editor"></div><div class="preview" id="preview"></div>';renderEditor();renderPaper()}else if(mod==='invoices'){if(!iDraft){el.innerHTML='<div class="empty-state">Select an invoice or create a new one</div>';return}el.innerHTML='<div class="editor" id="editor"></div><div class="preview" id="preview"></div>';renderInvoiceEditor();renderInvoicePaper()}else if(mod==='receipts'){const r=receipts.find(x=>x.id===rCurrent);if(!r){el.innerHTML='<div class="empty-state">Select a receipt to view</div>';return}el.innerHTML='<div class="preview" id="preview" style="display:flex;flex-direction:column"></div>';showPages(document.getElementById('preview'),receiptPaperHTML(r),`<div class="edsection thread-wrap"><h3>Activity</h3><div class="thread" id="docThread">${threadHTML(r.id)}</div></div>`)}else if(mod==='settings'){el.innerHTML='<div class="catalog" id="catalog"></div>';renderCatalog()}}

function renderEditor(){const el=document.getElementById('editor');if(!el||!pDraft)return;const p=pDraft;const opts=addItemOptions(p.type);el.innerHTML=`<div class="edsection"><h3>Proposal type</h3><div class="type-sel"><button class="type-btn${p.type==='tier1'?' on':''}" onclick="pDraft.type='tier1';pDraft.items=[];touched();renderEditor()">Tier 1<br><small>Brand Identity</small></button><button class="type-btn${p.type==='tier2'?' on':''}" onclick="pDraft.type='tier2';pDraft.items=[];touched();renderEditor()">Tier 2 (SME)<br><small>Strategic Identity</small></button><button class="type-btn${p.type==='bespoke'?' on':''}" onclick="pDraft.type='bespoke';pDraft.items=[];touched();renderEditor()">Bespoke<br><small>Custom project</small></button></div></div><div class="edsection"><h3>Client</h3><div class="edrow"><div class="edgroup"><label class="edlabel">Business name</label><input data-f="client.business" value="${esc(p.client.business)}"></div><div class="edgroup"><label class="edlabel">Contact person</label><input data-f="client.name" value="${esc(p.client.name)}"></div></div><div class="edrow"><div class="edgroup"><label class="edlabel">Contact details</label><input data-f="client.contact" value="${esc(p.client.contact)}" placeholder="Phone / email"></div><div class="edgroup"><label class="edlabel">Industry</label><input data-f="client.industry" value="${esc(p.client.industry)}"></div></div></div><div class="edsection"><h3>Proposal details</h3><div class="edrow"><div class="edgroup"><label class="edlabel">Date</label><input type="date" data-f="date" value="${p.date}"></div><div class="edgroup"><label class="edlabel">Valid for (days)</label><input type="number" data-f="validDays" value="${p.validDays}"></div><div class="edgroup"><label class="edlabel">Prepared by</label><input data-f="preparedBy" value="${esc(p.preparedBy)}"></div></div></div><div class="edsection"><h3>Message to client</h3><textarea data-f="intro" rows="3">${esc(p.intro)}</textarea></div><div class="edsection"><h3>Scope and pricing</h3><div id="itemsList">${renderItems(p)}</div>${p.type==='bespoke'?`<div class="add-row"><button class="btn btn-brand" onclick="addBespokeItem()">+ Add custom item</button></div>`:`<div class="add-row"><select id="addSel"><option value="">Add item…</option>${opts.map(o=>o.disabled?`<option disabled>${esc(o.label)}</option>`:`<option value="${o.value}">${esc(o.label)}</option>`).join('')}</select><button class="btn btn-brand" onclick="addItemToProposal(document.getElementById('addSel').value);document.getElementById('addSel').value=''">Add</button></div>`}</div><div class="edsection"><h3>Discount & payment</h3><div class="edrow"><div class="edgroup"><label class="edlabel">Discount type</label><select data-f="discount.type"><option value="amount"${p.discount.type==='amount'?' selected':''}>Fixed amount (₱)</option><option value="percent"${p.discount.type==='percent'?' selected':''}>Percentage (%)</option></select></div><div class="edgroup"><label class="edlabel">Value</label><input type="number" data-f="discount.value" value="${num(p.discount.value)}"></div><div class="edgroup"><label class="edlabel">Downpayment %</label><input type="number" data-f="downpaymentPct" value="${num(p.downpaymentPct)}"></div></div></div><div class="edsection"><h3>How we'll work</h3><textarea data-f="timeline" rows="4">${esc(p.timeline)}</textarea></div><div class="edsection"><h3>Terms</h3><textarea data-f="terms" rows="10">${esc(p.terms)}</textarea><div style="font-size:11px;color:var(--tx3);margin-top:4px">One clause per line as \u201CTitle: text\u201D. {downpayment} and {validUntil} fill in automatically</div></div><div class="edsection"><h3>Internal notes</h3><textarea data-f="notes" rows="2" placeholder="Not shown to client">${esc(p.notes)}</textarea></div><div class="edsection"><h3>Activity</h3><div class="thread" id="docThread">${threadHTML(p.id)}</div></div>`}

function renderItems(p){return(p.items||[]).map((item,idx)=>{const isBespoke=p.type==='bespoke';const isCol=item.kind==='collateral'||item.kind==='branding';let body=`<div class="eitem-body"><div class="edgroup"${isBespoke?' style="flex:2"':''}><label class="edlabel">Name</label><input data-k="${idx}.name" value="${esc(item.name)}"></div><div class="edgroup" style="max-width:100px"><label class="edlabel">Price (₱)</label><input type="number" data-k="${idx}.price" value="${num(item.price)}"></div><div class="edgroup" style="max-width:70px"><label class="edlabel">Qty</label><input type="number" data-k="${idx}.qty" value="${num(item.qty)}" min="1"></div></div>`;if(isBespoke)body+=`<div style="margin-top:6px"><label class="edlabel">Description / scope</label><textarea data-k="${idx}.description" rows="2" placeholder="Detailed scope of work">${esc(item.description||'')}</textarea></div>`;if(isCol&&item.min!=null){const mid=Math.round((num(item.min)+num(item.max))/2);body+=`<div class="complexity"><button class="${num(item.price)===num(item.min)?'on':''}" onclick="setItemPrice(${idx},${item.min})">Simple</button><button class="${num(item.price)===mid?'on':''}" onclick="setItemPrice(${idx},${mid})">Standard</button><button class="${num(item.price)===num(item.max)?'on':''}" onclick="setItemPrice(${idx},${item.max})">Complex</button></div>`}if(item.inclusions&&item.inclusions.length&&!isBespoke)body+=`<div class="inclusions">${item.inclusions.map(i=>esc(i)).join(' · ')}</div>`;return`<div class="eitem"><div class="eitem-head"><span class="eitem-name">${item.kind==='package'?'📦':item.kind==='collateral'?'🎨':item.kind==='branding'?'⭐':'✏️'} ${esc(item.kind)}</span><div class="eitem-acts">${idx>0?`<button onclick="moveItem(${idx},-1)">↑</button>`:''} ${idx<p.items.length-1?`<button onclick="moveItem(${idx},1)">↓</button>`:''}<button onclick="removeItem(${idx})">✕</button></div></div>${body}</div>`}).join('')}

function addBespokeItem(){if(!pDraft)return;pDraft.items.push({id:uid('i'),kind:'custom',name:'',price:0,qty:1,description:'',inclusions:[]});touched();renderEditor()}
function setItemPrice(idx,price){if(!pDraft||!pDraft.items[idx])return;pDraft.items[idx].price=price;touched();renderEditor()}
function moveItem(idx,dir){if(!pDraft)return;const items=pDraft.items;const ni=idx+dir;if(ni<0||ni>=items.length)return;[items[idx],items[ni]]=[items[ni],items[idx]];touched();renderEditor()}
function removeItem(idx){if(!pDraft)return;pDraft.items.splice(idx,1);touched();renderEditor()}
function renderPaper(){const el=document.getElementById('preview');if(!el||!pDraft)return;showPages(el,proposalPaperHTML(pDraft))}

function renderInvoiceEditor(){const el=document.getElementById('editor');if(!el||!iDraft)return;const inv=iDraft;el.innerHTML=`${inv.proposalNumber?`<div class="cat-notice">Linked to proposal <strong>${esc(inv.proposalNumber)}</strong></div>`:''}<div class="edsection"><h3>Client</h3><div class="edrow"><div class="edgroup"><label class="edlabel">Business name</label><input data-fi="client.business" value="${esc(inv.client.business)}"></div><div class="edgroup"><label class="edlabel">Contact person</label><input data-fi="client.name" value="${esc(inv.client.name)}"></div></div><div class="edrow"><div class="edgroup"><label class="edlabel">Contact details</label><input data-fi="client.contact" value="${esc(inv.client.contact)}"></div></div></div><div class="edsection"><h3>Invoice details</h3><div class="edrow"><div class="edgroup"><label class="edlabel">Date</label><input type="date" data-fi="date" value="${inv.date}"></div><div class="edgroup"><label class="edlabel">Due in (days)</label><input type="number" data-fi="dueDays" value="${num(inv.dueDays)}"></div><div class="edgroup"><label class="edlabel">Prepared by</label><input data-fi="preparedBy" value="${esc(inv.preparedBy)}"></div></div></div><div class="edsection"><h3>Items</h3>${(inv.items||[]).map((item,idx)=>`<div class="eitem"><div class="eitem-body"><div class="edgroup" style="flex:2"><label class="edlabel">Description</label><input data-ii="${idx}.name" value="${esc(item.name)}"></div><div class="edgroup" style="max-width:100px"><label class="edlabel">Price (₱)</label><input type="number" data-ii="${idx}.price" value="${num(item.price)}"></div><div class="edgroup" style="max-width:70px"><label class="edlabel">Qty</label><input type="number" data-ii="${idx}.qty" value="${num(item.qty)}" min="1"></div><button class="btn btn-outline btn-sm" style="align-self:end;margin-bottom:2px" onclick="removeInvItem(${idx})">✕</button></div></div>`).join('')}<button class="btn btn-outline btn-sm" onclick="addInvItem()">+ Add item</button></div><div class="edsection"><h3>Discount</h3><div class="edrow"><div class="edgroup"><label class="edlabel">Type</label><select data-fi="discount.type"><option value="amount"${inv.discount.type==='amount'?' selected':''}>Fixed (₱)</option><option value="percent"${inv.discount.type==='percent'?' selected':''}>Percent (%)</option></select></div><div class="edgroup"><label class="edlabel">Value</label><input type="number" data-fi="discount.value" value="${num(inv.discount.value)}"></div></div></div><div class="edsection"><h3>Terms</h3><textarea data-fi="terms" rows="3">${esc(inv.terms)}</textarea><div style="font-size:11px;color:var(--tx3);margin-top:4px">{dueDays} fills in automatically</div></div>${inv.payments&&inv.payments.length?`<div class="edsection"><h3>Payment history</h3>${inv.payments.map(pay=>`<div class="eitem" style="padding:8px 12px"><div style="display:flex;justify-content:space-between;align-items:center"><span>${shortDate(pay.date)} — ${esc(pay.method)}${pay.reference?' #'+esc(pay.reference):''}</span><strong>${peso(pay.amount)}</strong></div></div>`).join('')}<div style="text-align:right;font-weight:700;margin-top:4px">Balance: ${peso(invoiceTotals(inv).balance)}</div></div>`:''}<div class="edsection"><h3>Notes</h3><textarea data-fi="notes" rows="2" placeholder="Internal notes">${esc(inv.notes)}</textarea></div><div class="edsection"><h3>Activity</h3><div class="thread" id="docThread">${threadHTML(inv.id)}</div></div>`}
function addInvItem(){if(!iDraft)return;iDraft.items.push({id:uid('i'),name:'',price:0,qty:1});touched();renderInvoiceEditor()}
function removeInvItem(idx){if(!iDraft)return;iDraft.items.splice(idx,1);touched();renderInvoiceEditor()}
function renderInvoicePaper(){const el=document.getElementById('preview');if(!el||!iDraft)return;showPages(el,invoicePaperHTML(iDraft))}

function openMessenger(){if(!pDraft)return;const txt=messengerText(pDraft);const m=document.getElementById('modal');m.hidden=false;m.innerHTML=`<div class="modal-box"><div class="modal-head"><span>Copy for Messenger</span><button onclick="closeModal()">✕</button></div><div class="modal-body"><textarea id="msgText">${esc(txt)}</textarea></div><div class="modal-foot"><button class="btn btn-brand" onclick="copyMsg()">📋 Copy</button><button class="btn btn-outline" onclick="closeModal()">Close</button></div></div>`}
function copyMsg(){const ta=document.getElementById('msgText');if(!ta)return;try{navigator.clipboard.writeText(ta.value);toast('Copied!');if(pDraft)logActivity('messenger','proposal',pDraft,'Copied for Messenger')}catch{ta.select();toast('Select all → copy manually')}}
function openPaymentModal(){if(!iDraft)return;const bal=invoiceTotals(iDraft).balance;const methods=settings.paymentMethods;const m=document.getElementById('modal');m.hidden=false;m.innerHTML=`<div class="modal-box"><div class="modal-head"><span>Record Payment</span><button onclick="closeModal()">✕</button></div><div class="modal-body"><div class="edgroup"><label class="edlabel">Amount (balance: ${peso(bal)})</label><input type="number" id="payAmt" value="${bal}" step="0.01"></div><div class="edgroup" style="margin-top:10px"><label class="edlabel">Payment method <span style="color:var(--red)">*</span></label>${methodPickerHTML('')}</div><div class="edgroup" style="margin-top:8px"><label class="edlabel">Reference number</label><input id="payRef" placeholder="Optional"></div><div class="edgroup" style="margin-top:8px"><label class="edlabel">Purpose / notes</label><input id="payPurpose" placeholder="e.g. Downpayment, Balance payment"></div></div><div class="modal-foot"><button class="btn btn-green" onclick="submitPayment()">Record & create receipt</button><button class="btn btn-outline" onclick="closeModal()">Cancel</button></div></div>`}
function submitPayment(){if(!iDraft)return;const amt=num(document.getElementById('payAmt').value);const method=pickedMethod();if(!method){toast('Choose how the client paid');return}const ref=document.getElementById('payRef').value.trim();const purpose=document.getElementById('payPurpose').value.trim();if(amt<=0){toast('Enter an amount');return}if(dirty)saveNow();const r=createReceipt(iDraft,amt,method,ref,purpose);closeModal();toast('Receipt '+r.number+' created');renderAll()}
function methodPickerHTML(current){const ms=[...settings.paymentMethods.filter(Boolean),'Other'];const known=ms.includes(current);return`<div class="mpick" id="mpick">${ms.map(m=>`<button type="button" class="mopt${(current&&(m===current||(!known&&m==='Other')))?' on':''}" onclick="pickMethod(this)">${esc(m)}</button>`).join('')}</div><input id="payOther" placeholder="Type the method" value="${!known&&current?esc(current):''}" style="margin-top:6px" ${!known&&current?'':'hidden'}>`}
function pickMethod(b){document.querySelectorAll('#mpick .mopt').forEach(x=>x.classList.toggle('on',x===b));const o=document.getElementById('payOther');o.hidden=b.textContent!=='Other';if(!o.hidden)o.focus()}
function pickedMethod(){const b=document.querySelector('#mpick .mopt.on');if(!b)return'';if(b.textContent==='Other')return document.getElementById('payOther').value.trim();return b.textContent}
function openReceiptEdit(){const r=receipts.find(x=>x.id===rCurrent);if(!r)return;const m=document.getElementById('modal');m.hidden=false;m.innerHTML=`<div class="modal-box" style="max-width:460px"><div class="modal-head"><span>Edit payment details · ${esc(r.number)}</span><button onclick="closeModal()">✕</button></div><div class="modal-body"><div class="edgroup"><label class="edlabel">Payment method</label>${methodPickerHTML(r.method)}</div><div class="edrow" style="margin-top:10px"><div class="edgroup"><label class="edlabel">Reference number</label><input id="payRef" value="${esc(r.reference)}"></div><div class="edgroup"><label class="edlabel">Date received</label><input type="date" id="payDate" value="${esc(r.date)}"></div></div><div class="edgroup" style="margin-top:8px"><label class="edlabel">Purpose / notes</label><input id="payPurpose" value="${esc(r.purpose)}"></div><div style="font-size:12px;color:var(--tx3);margin-top:8px">Amount stays ${peso(r.amount)}. The invoice’s payment history updates too.</div></div><div class="modal-foot"><button class="btn btn-brand" onclick="saveReceiptEdit()">Save</button><button class="btn btn-outline" onclick="closeModal()">Cancel</button></div></div>`}
function saveReceiptEdit(){const r=receipts.find(x=>x.id===rCurrent);if(!r)return;const method=pickedMethod();if(!method){toast('Choose how the client paid');return}const ref=document.getElementById('payRef').value.trim(),date=document.getElementById('payDate').value||r.date,purpose=document.getElementById('payPurpose').value.trim();const changes=[];if(method!==r.method)changes.push(`method ${r.method||'—'} → ${method}`);if(ref!==r.reference)changes.push('reference');if(date!==r.date)changes.push('date');if(purpose!==r.purpose)changes.push('purpose');if(!changes.length){closeModal();return}Object.assign(r,{method,reference:ref,date,purpose});store.saveReceipt(clone(r));const inv=invoices.find(x=>x.id===r.invoiceId);if(inv){const pay=(inv.payments||[]).find(x=>x.id===r.id);if(pay){Object.assign(pay,{method,reference:ref,date});inv.updatedAt=new Date().toISOString();store.saveInvoice(clone(inv));if(iDraft&&iDraft.id===inv.id)iDraft=clone(inv)}}logActivity('edited','receipt',r,'Payment details edited: '+changes.join(', '),{relatedId:r.invoiceId});closeModal();toast('Receipt updated');renderAll()}
function closeModal(){document.getElementById('modal').hidden=true}
let delTarget=null,delTimer=null;
function confirmDelete(type){if(delTarget===type){clearTimeout(delTimer);delTarget=null;if(type==='proposal')deleteProposal();else if(type==='invoice')deleteInvoice();return}delTarget=type;toast('Click delete again to confirm',2000);delTimer=setTimeout(()=>{delTarget=null},4000)}

async function downloadPdf(type){let paperHTML='',filename='';if(type==='proposal'&&pDraft){paperHTML=proposalPaperHTML(pDraft);filename=(pDraft.number||'proposal')+'.pdf'}else if(type==='invoice'&&iDraft){paperHTML=invoicePaperHTML(iDraft);filename=(iDraft.number||'invoice')+'.pdf'}else if(type==='receipt'){const r=receipts.find(x=>x.id===rCurrent);if(!r)return;paperHTML=receiptPaperHTML(r);filename=(r.number||'receipt')+'.pdf'}else return;const ready=await window._html2pdfReady;if(!ready||typeof html2pdf==='undefined'){toast('PDF library failed to load. Try again.');return}const host=document.getElementById('pdfHost');host.innerHTML=buildPages(paperHTML,{print:true}).join('');const pages=[...host.children];try{const opt={margin:0,filename,image:{type:'jpeg',quality:0.96},html2canvas:{scale:2,useCORS:true,width:A4.w,height:A4.h,windowWidth:A4.w},jsPDF:{unit:'px',format:[A4.w,A4.h],orientation:'portrait',hotfixes:['px_scaling']},pagebreak:{mode:[]}};let w=html2pdf().set(opt).from(pages[0]).toPdf();for(let i=1;i<pages.length;i++){const pg=pages[i];w=w.get('pdf').then(pdf=>{pdf.addPage([A4.w,A4.h],'portrait')}).from(pg).toContainer().toCanvas().toPdf()}const blob=await w.outputPdf('blob');if(downloads){await downloads.save({filename,data:blob})}else{const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)}toast('PDF ready');logActivity('pdf',type,type==='proposal'?pDraft:type==='invoice'?iDraft:receipts.find(x=>x.id===rCurrent),'Downloaded PDF')}catch(e){toast('PDF error: '+e.message)}finally{host.innerHTML=''}}
function currentPaperHTML(){if(mod==='proposals'&&pDraft)return proposalPaperHTML(pDraft);if(mod==='invoices'&&iDraft)return invoicePaperHTML(iDraft);if(mod==='receipts'){const r=receipts.find(x=>x.id===rCurrent);if(r)return receiptPaperHTML(r)}return''}
function preparePrint(){const html=currentPaperHTML();if(!html)return false;let ph=document.getElementById('printHost');if(!ph){ph=document.createElement('div');ph.id='printHost';document.body.appendChild(ph)}ph.innerHTML=buildPages(html,{print:true}).join('');document.body.classList.add('printing');return true}
function printDoc(){const d=mod==='proposals'?pDraft:mod==='invoices'?iDraft:receipts.find(x=>x.id===rCurrent);if(!preparePrint())return;if(d)logActivity('print',mod.slice(0,-1),d,'Printed');setTimeout(()=>{try{window.print()}catch{toast('Use the PDF button to download and print')}},150)}
window.addEventListener('afterprint',()=>document.body.classList.remove('printing'));

function renderCatalog(){const el=document.getElementById('catalog');if(!el)return;const s=settings;let h=`<h2>Packages & Settings</h2><div class="cat-notice">Changes here apply to new proposals. Existing proposals keep their own copy of items.</div>`;
h+=`<div class="cat-section"><h3>Tier 1 — Premium Brand Identity</h3>`;s.tier1.forEach((pkg,i)=>{h+=`<div class="cat-pkg"><div class="edrow"><div class="edgroup"><label class="edlabel">Name</label><input data-c="tier1.${i}.name" value="${esc(pkg.name)}"></div><div class="edgroup" style="max-width:120px"><label class="edlabel">Price (₱)</label><input type="number" data-c="tier1.${i}.price" value="${num(pkg.price)}"></div></div><div class="edgroup"><label class="edlabel">Tagline</label><input data-c="tier1.${i}.tagline" value="${esc(pkg.tagline)}"></div></div>`});h+=`</div>`;
h+=`<div class="cat-section"><h3>Tier 2 — Strategic Brand Identity (SME)</h3>`;s.tier2.forEach((pkg,i)=>{h+=`<div class="cat-pkg"><div class="edrow"><div class="edgroup"><label class="edlabel">Name</label><input data-c="tier2.${i}.name" value="${esc(pkg.name)}"></div><div class="edgroup" style="max-width:120px"><label class="edlabel">Price (₱)</label><input type="number" data-c="tier2.${i}.price" value="${num(pkg.price)}"></div></div><div class="edgroup"><label class="edlabel">Tagline</label><input data-c="tier2.${i}.tagline" value="${esc(pkg.tagline)}"></div></div>`});h+=`</div>`;
h+=`<div class="cat-section"><h3>Collaterals</h3>`;s.collaterals.forEach((col,i)=>{h+=`<div class="cat-pkg"><div class="edrow"><div class="edgroup"><label class="edlabel">Name</label><input data-c="collaterals.${i}.name" value="${esc(col.name)}"></div><div class="edgroup" style="max-width:100px"><label class="edlabel">From (₱)</label><input type="number" data-c="collaterals.${i}.min" value="${num(col.min)}"></div><div class="edgroup" style="max-width:100px"><label class="edlabel">Up to (₱)</label><input type="number" data-c="collaterals.${i}.max" value="${num(col.max)}"></div><button class="btn btn-outline btn-sm" style="align-self:end;margin-bottom:2px" onclick="settings.collaterals.splice(${i},1);renderCatalog()">✕</button></div></div>`});h+=`<button class="btn btn-outline btn-sm" onclick="settings.collaterals.push({id:uid('col'),name:'',min:0,max:0});renderCatalog()">+ Add collateral</button></div>`;
h+=`<div class="cat-section"><h3>Payment methods</h3><div class="edgroup"><label class="edlabel">Comma-separated</label><input data-c="paymentMethods" value="${esc(s.paymentMethods.join(', '))}"></div><div class="edgroup" style="margin-top:8px"><label class="edlabel">Payment details shown on proposals and invoices (one per line: Method | Account name | Account number)</label><textarea data-c="paymentDetails" rows="3">${esc(s.paymentDetails||'')}</textarea></div></div>`;
h+=`<div class="cat-section"><h3>Business details</h3><div class="edrow"><div class="edgroup"><label class="edlabel">Business name</label><input data-c="business.name" value="${esc(s.business.name)}"></div><div class="edgroup"><label class="edlabel">Tagline</label><input data-c="business.tagline" value="${esc(s.business.tagline)}"></div></div><div class="edrow"><div class="edgroup"><label class="edlabel">Website</label><input data-c="business.website" value="${esc(s.business.website)}"></div><div class="edgroup"><label class="edlabel">Facebook</label><input data-c="business.facebook" value="${esc(s.business.facebook)}"></div></div><div class="edrow"><div class="edgroup"><label class="edlabel">Email</label><input data-c="business.email" value="${esc(s.business.email)}"></div><div class="edgroup"><label class="edlabel">Phone</label><input data-c="business.phone" value="${esc(s.business.phone)}"></div></div></div>`;
h+=`<div class="cat-section"><h3>Signature</h3><div class="edrow"><div class="edgroup"><label class="edlabel">Signed by</label><input data-c="signer.name" value="${esc((s.signer||{}).name||'')}"></div><div class="edgroup"><label class="edlabel">Title</label><input data-c="signer.title" value="${esc((s.signer||{}).title||'')}"></div></div><label style="display:flex;align-items:center;gap:8px;font-size:13px;margin-top:6px;cursor:pointer"><input type="checkbox" data-c="signer.show" style="width:auto" ${(s.signer||{}).show!==false?'checked':''}> Add the e-signature to proposals, invoices and receipts</label><img src="${SIGNATURE}" alt="" style="height:60px;margin-top:10px;background:#fff;border-radius:6px;padding:4px 10px"></div>`;
h+=`<div class="cat-section"><h3>Proposal defaults</h3><div class="edrow"><div class="edgroup"><label class="edlabel">Prepared by</label><input data-c="defaults.preparedBy" value="${esc(s.defaults.preparedBy)}"></div><div class="edgroup" style="max-width:100px"><label class="edlabel">Valid days</label><input type="number" data-c="defaults.validDays" value="${num(s.defaults.validDays)}"></div><div class="edgroup" style="max-width:100px"><label class="edlabel">Downpayment %</label><input type="number" data-c="defaults.downpaymentPct" value="${num(s.defaults.downpaymentPct)}"></div></div><div class="edgroup"><label class="edlabel">Default intro</label><textarea data-c="defaults.intro" rows="3">${esc(s.defaults.intro)}</textarea></div><div class="edgroup" style="margin-top:6px"><label class="edlabel">Default timeline</label><textarea data-c="defaults.timeline" rows="3">${esc(s.defaults.timeline)}</textarea></div><div class="edgroup" style="margin-top:6px"><label class="edlabel">Default terms</label><textarea data-c="defaults.terms" rows="12">${esc(s.defaults.terms)}</textarea></div></div>`;
h+=`<div class="cat-section"><h3>Invoice defaults</h3><div class="edrow"><div class="edgroup" style="max-width:100px"><label class="edlabel">Due days</label><input type="number" data-c="defaults.dueDays" value="${num(s.defaults.dueDays)}"></div></div><div class="edgroup"><label class="edlabel">Invoice terms</label><textarea data-c="defaults.invoiceTerms" rows="5">${esc(s.defaults.invoiceTerms)}</textarea></div><div class="edgroup" style="margin-top:6px"><label class="edlabel">Receipt note</label><textarea data-c="defaults.receiptNote" rows="2">${esc(s.defaults.receiptNote||'')}</textarea></div></div>`;
el.innerHTML=h}
function saveCatalog(){document.querySelectorAll('[data-c]').forEach(inp=>{const path=inp.dataset.c;let val=inp.value;if(inp.type==='number')val=num(val);if(inp.type==='checkbox')val=inp.checked;if(path==='paymentMethods'){settings.paymentMethods=val.split(',').map(s=>s.trim()).filter(Boolean);return}setPath(settings,path,val)});if(store)store.saveSettings(clone(settings));logActivity('settings','settings',null,'Updated packages & settings');toast('Settings saved');renderAll()}

document.addEventListener('input',e=>{const el=e.target;if(el.dataset.f&&pDraft){let v=el.value;if(el.type==='number')v=num(v);setPath(pDraft,el.dataset.f,v);touched();renderPaper()}if(el.dataset.k&&pDraft){const[idx,...rest]=el.dataset.k.split('.');const item=pDraft.items[num(idx)];if(item){const key=rest.join('.');let v=el.value;if(el.type==='number')v=num(v);if(key==='name')item.name=v;else if(key==='price')item.price=v;else if(key==='qty')item.qty=v;else if(key==='description')item.description=v;touched();renderPaper()}}if(el.dataset.fi&&iDraft){let v=el.value;if(el.type==='number')v=num(v);setPath(iDraft,el.dataset.fi,v);touched();renderInvoicePaper()}if(el.dataset.ii&&iDraft){const[idx,...rest]=el.dataset.ii.split('.');const item=iDraft.items[num(idx)];if(item){const key=rest.join('.');let v=el.value;if(el.type==='number')v=num(v);if(key==='name')item.name=v;else if(key==='price')item.price=v;else if(key==='qty')item.qty=v;touched();renderInvoicePaper()}}});

function route(){const h=location.hash.slice(1)||'proposals';const valid=['proposals','invoices','receipts','settings','activity'];const newMod=valid.includes(h)?h:'proposals';if(newMod!==mod){if(dirty)saveNow();mod=newMod;sFilter='all';sQuery='';showPreview=false;renderAll()}}
document.querySelectorAll('.tab[data-mod]').forEach(t=>{t.addEventListener('click',()=>{location.hash=t.dataset.mod})});
window.addEventListener('hashchange',route);




function onProposals(list){proposals=list.map(normProposal);setSync(true);let changed=false;if(pCurrent&&pDraft&&!dirty){const remote=proposals.find(x=>x.id===pCurrent);if(remote&&remote.updatedAt!==pDraft.updatedAt){pDraft=clone(remote);changed=true}}if(!pCurrent&&proposals.length){const s=[...proposals].sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''));pCurrent=s[0].id;pDraft=clone(s[0]);changed=true}renderTabs();if(mod!=='proposals')return;if(!sidebarBusy())renderSidebar();if(changed&&!contentBusy())renderContent();renderBar()}
function onInvoices(list){invoices=list.map(normInvoice);let changed=false;if(iCurrent&&iDraft&&!dirty){const remote=invoices.find(x=>x.id===iCurrent);if(remote&&remote.updatedAt!==iDraft.updatedAt){iDraft=clone(remote);changed=true}}renderTabs();if(mod!=='invoices')return;if(!sidebarBusy())renderSidebar();if(changed&&!contentBusy())renderContent();renderBar()}
function onReceipts(list){receipts=list.map(normReceipt);renderTabs();if(mod!=='receipts')return;if(!sidebarBusy())renderSidebar();if(!contentBusy())renderContent()}
function onSettings(data){settings=mergeSettings(data);if(mod==='settings'||contentBusy())return;renderContent()}
function onActivity(list){const local=activity.filter(e=>!list.some(x=>x.id===e.id)&&Date.now()-new Date(e.ts).getTime()<15000);activity=local.concat(list).sort((a,b)=>(b.ts||'').localeCompare(a.ts||''));refreshActivityViews()}

/* ---------- theme ---------- */
function applyTheme(){let t=null;try{t=localStorage.getItem('ccc-theme')}catch{}const dark=t?t==='dark':!!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);document.body.classList.toggle('dark',dark);document.querySelectorAll('.themeBtn').forEach(b=>{b.textContent=dark?'☀️':'🌙'})}
function toggleTheme(){const dark=!document.body.classList.contains('dark');try{localStorage.setItem('ccc-theme',dark?'dark':'light')}catch{}applyTheme()}

/* ---------- sign in / sign out ---------- */
function setSync(){const el=document.getElementById('sync');if(!el)return;el.innerHTML=demoMode?'Demo · this browser only':'<span class="livedot"></span>Live'}
function renderUserChip(){const n=userName();document.getElementById('userChip').innerHTML=`<span class="avatar">${esc(n.charAt(0).toUpperCase())}</span><span class="uname">${esc(n)}</span>`}
function warnSub(name){return e=>{console.warn(name+' sync error',e);if(e&&e.code==='permission-denied')toast('Firestore rules are blocking access — see the setup notes.',6000)}}
function startData(){stopData();const s=store;unsubs=[s.subscribeProposals(onProposals,warnSub('proposals')),s.subscribeInvoices(onInvoices,warnSub('invoices')),s.subscribeReceipts(onReceipts,warnSub('receipts')),s.subscribeSettings(onSettings,warnSub('settings')),s.subscribeActivity(onActivity,warnSub('activity'))]}
function stopData(){unsubs.forEach(u=>{try{if(typeof u==='function')u()}catch{}});unsubs=[]}
function resetData(){proposals=[];invoices=[];receipts=[];activity=[];pCurrent=iCurrent=rCurrent=null;pDraft=iDraft=null;dirty=false;settings=clone(DEFAULT_SETTINGS)}
function showLogin(note){document.getElementById('login').hidden=false;const n=document.getElementById('loginNote');if(note){n.innerHTML=note;n.hidden=false}else n.hidden=true;setTimeout(()=>{const e=document.getElementById('loginEmail');if(e)e.focus()},50)}
function showApp(){document.getElementById('login').hidden=true;renderUserChip();setSync();const h=location.hash.slice(1);mod=['proposals','invoices','receipts','settings','activity'].includes(h)?h:'proposals';renderAll()}
function authMsg(e){const c=(e&&e.code)||'';if(/invalid-credential|wrong-password|user-not-found|invalid-email|invalid-login/.test(c))return'Email or password is incorrect.';if(/too-many-requests/.test(c))return'Too many attempts. Wait a minute, then try again.';if(/network/.test(c))return'No internet connection.';if(/user-disabled/.test(c))return'This account has been turned off.';return(e&&e.message)||'Could not sign in.'}
async function doSignIn(ev){ev.preventDefault();const err=document.getElementById('loginErr');err.style.color='';err.textContent='';const email=document.getElementById('loginEmail').value.trim();const pw=document.getElementById('loginPw').value;if(demoMode||!fbAuth){currentUser={email,displayName:email.split('@')[0]};demoMode=true;store=localStore();startData();showApp();logActivity('signin','session',null,'Signed in');return}const btn=document.getElementById('loginBtn');btn.disabled=true;btn.textContent='Signing in…';try{justSignedIn=true;await fbAuth.signInWithEmailAndPassword(email,pw)}catch(e){justSignedIn=false;err.textContent=authMsg(e)}finally{btn.disabled=false;btn.textContent='Sign in'}}
async function forgotPw(){const err=document.getElementById('loginErr');const email=document.getElementById('loginEmail').value.trim();err.style.color='';if(!fbAuth){err.textContent='Password reset works once Firebase is connected.';return}if(!email){err.textContent='Type your email above, then tap Forgot password.';return}try{await fbAuth.sendPasswordResetEmail(email);err.style.color='var(--green)';err.textContent='Reset link sent — check your inbox.'}catch(e){err.textContent=authMsg(e)}}
async function signOut(){if(dirty)saveNow();const saved=logActivity('signout','session',null,'Signed out');try{await Promise.race([saved||Promise.resolve(),new Promise(r=>setTimeout(r,1500))])}catch{}stopData();if(demoMode||!fbAuth){currentUser=null;resetData();renderAll();showLogin(demoNote());return}try{await fbAuth.signOut()}catch{}}
function openProfile(){const m=document.getElementById('modal');m.hidden=false;m.innerHTML=`<div class="modal-box" style="max-width:400px"><div class="modal-head"><span>Your profile</span><button onclick="closeModal()">✕</button></div><div class="modal-body"><div class="edgroup"><label class="edlabel">Display name (shown in the activity log)</label><input id="profName" value="${esc(currentUser&&currentUser.displayName||'')}" placeholder="e.g. Aljun"></div><div style="font-size:12px;color:var(--tx3);margin-top:8px">Signed in as ${esc(currentUser&&currentUser.email||'')}</div></div><div class="modal-foot"><button class="btn btn-brand" onclick="saveProfile()">Save</button><button class="btn btn-outline" onclick="closeModal()">Cancel</button></div></div>`}
async function saveProfile(){const name=document.getElementById('profName').value.trim();try{if(fbAuth&&fbAuth.currentUser){await fbAuth.currentUser.updateProfile({displayName:name});currentUser=fbAuth.currentUser}else if(currentUser)currentUser.displayName=name;renderUserChip();closeModal();toast('Saved')}catch(e){toast('Could not save: '+e.message)}}
function demoNote(){return'<strong>Firebase isn’t connected yet.</strong> You’re in demo mode: type any email and password to look around. Data stays in this browser only.'}
function configReady(){const c=window.FIREBASE_CONFIG;return!!(c&&c.apiKey&&!/PASTE/i.test(c.apiKey)&&typeof firebase!=='undefined')}
async function boot(){applyTheme();try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme)}catch{}renderAll();if(!configReady()){demoMode=true;showLogin(demoNote());return}try{if(!firebase.apps.length)firebase.initializeApp(window.FIREBASE_CONFIG);fbAuth=firebase.auth();store=dbStore(firebase.firestore());fbAuth.onAuthStateChanged(u=>{if(u){currentUser=u;startData();showApp();if(justSignedIn){justSignedIn=false;logActivity('signin','session',null,'Signed in')}}else{currentUser=null;stopData();resetData();renderAll();showLogin()}})}catch(e){console.error(e);demoMode=true;showLogin('Could not connect to Firebase: '+esc(e.message))}}
boot();
</script>
