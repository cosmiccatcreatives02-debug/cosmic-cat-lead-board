<style>
:root{--bg:#f5f5f7;--sf:#fff;--sf2:#f0f0f2;--tx:#1d1d1f;--tx2:#6e6e73;--tx3:#aeaeb2;--bd:#d2d2d7;--brand:#5271FF;--brand2:#5271FF;--green:#10b981;--red:#ef4444;--orange:#f59e0b;--r:10px;--font:'Figtree',system-ui,sans-serif;--dsp:'Bricolage Grotesque',system-ui,sans-serif}
.dark{--bg:#1c1c1e;--sf:#2c2c2e;--sf2:#3a3a3c;--tx:#f5f5f7;--tx2:#a1a1a6;--tx3:#636366;--bd:#48484a}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--tx);height:100vh;display:flex;flex-direction:column;overflow:hidden;font-size:14px}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:6px;padding:6px 10px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--brand)}
textarea{resize:vertical;min-height:60px}
select{cursor:pointer}
.badge{width:36px;height:36px;border-radius:50%;background:var(--brand2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.badge-ring{width:28px;height:28px;border-radius:50%;border:2px solid #fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.badge-ring span{font-family:var(--dsp);font-weight:800;font-size:6.5px;color:#fff;letter-spacing:.5px}
.topbar{height:48px;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--sf);border-bottom:1px solid var(--bd);flex-shrink:0;overflow-x:auto}
.topbar .logo{font-family:var(--dsp);font-weight:700;font-size:15px;white-space:nowrap;margin-right:4px}
.tab{padding:6px 14px;border-radius:20px;font-weight:600;font-size:13px;white-space:nowrap;transition:background .15s,color .15s}
.tab:hover{background:var(--sf2)}
.tab.on{background:var(--brand);color:#fff}
.tab .tcount{font-size:11px;opacity:.7;margin-left:4px}
.tbr{display:flex;align-items:center;gap:6px;margin-left:auto;flex-shrink:0;padding-left:8px}
.iconbtn{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.iconbtn:hover{background:var(--sf2)}
.menu-btn{display:none}
.userchip{display:flex;align-items:center;gap:6px;padding:3px 10px 3px 3px;border-radius:20px;background:var(--sf2);font-size:12px;font-weight:600;white-space:nowrap}
.userchip:hover{background:var(--bd)}
.avatar{width:24px;height:24px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.livedot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:5px;vertical-align:middle}
.login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:150;padding:20px}
.login-card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:32px 28px;width:100%;max-width:380px;box-shadow:0 8px 30px rgba(0,0,0,.06);text-align:center}
.login-card h1{font-family:var(--dsp);font-size:22px;margin:14px 0 4px}
.login-card p{color:var(--tx2);font-size:13px;margin-bottom:20px}
.login-card form{text-align:left}
.login-card .edgroup{margin-bottom:12px}
.login-card input{padding:9px 12px}
.login-card .btn{width:100%;padding:10px;font-size:14px}
.login-err{font-size:12px;min-height:18px;margin-bottom:8px;color:var(--red)}
.login-link{font-size:12px;color:var(--brand);margin-top:14px;font-weight:600}
.login-note{font-size:12px;background:var(--sf2);border-radius:8px;padding:12px;margin-top:16px;color:var(--tx2);line-height:1.5;text-align:left}
.login-theme{position:absolute;top:16px;right:16px}
#sync{font-size:11px;color:var(--tx3);white-space:nowrap;flex-shrink:0}
.main{flex:1;display:flex;overflow:hidden}
.sidebar{width:280px;border-right:1px solid var(--bd);display:flex;flex-direction:column;background:var(--sf);overflow:hidden;flex-shrink:0}
.workspace{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.snew{margin:12px;display:flex;gap:6px}
.snew button{flex:1;padding:8px;border-radius:var(--r);font-weight:600;font-size:13px}
.snew .primary{background:var(--brand);color:#fff}
.snew .primary:hover{opacity:.9}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:0 12px 8px}
.stat{background:var(--sf2);border-radius:8px;padding:8px;text-align:center}
.stat-n{font-family:var(--dsp);font-weight:700;font-size:20px}
.stat-l{font-size:10px;color:var(--tx2);text-transform:uppercase;letter-spacing:.3px}
.ssearch{padding:0 12px 8px}
.ssearch input{font-size:13px;padding:7px 10px;background:var(--sf2);border:none}
.sfilter{display:flex;gap:4px;padding:0 12px 8px;flex-wrap:wrap}
.chip{padding:4px 10px;border-radius:14px;font-size:11px;font-weight:600;background:var(--sf2);transition:all .15s}
.chip:hover{background:var(--bd)}
.chip.on{background:var(--brand);color:#fff}
.slist{flex:1;overflow-y:auto;padding:0 8px 8px}
.pitem{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:8px;margin-bottom:2px;transition:background .12s}
.pitem:hover{background:var(--sf2)}
.pitem.on{background:color-mix(in srgb,var(--brand) 12%,transparent)}
.pitem-num{font-size:11px;color:var(--tx2);font-weight:600}
.pitem-name{font-weight:600;font-size:13px;margin:2px 0}
.pitem-meta{font-size:11px;color:var(--tx3);display:flex;gap:8px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dot-draft{background:var(--tx3)}.dot-sent{background:var(--orange)}.dot-accepted,.dot-paid{background:var(--green)}.dot-declined{background:var(--red)}.dot-unpaid{background:var(--red)}.dot-partial{background:var(--orange)}.dot-overdue{background:var(--red)}
.wsbar{padding:6px 12px;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--bd);background:var(--sf);flex-shrink:0;flex-wrap:wrap}
.wsbar select{width:auto;font-size:12px;padding:4px 8px}
.wsbar .wstotal{font-family:var(--dsp);font-weight:700;font-size:15px;margin:0 4px}
.wsbar .wssave{font-size:11px;color:var(--tx3)}
.wsbar .spacer{flex:1}
.btn{padding:5px 12px;border-radius:6px;font-weight:600;font-size:12px;white-space:nowrap;transition:all .15s}
.btn:hover{opacity:.85}
.btn-brand{background:var(--brand);color:#fff}
.btn-blue{background:var(--brand2);color:#fff}
.btn-green{background:var(--green);color:#fff}
.btn-outline{border:1px solid var(--bd)}
.btn-red{background:var(--red);color:#fff}
.btn-sm{padding:3px 8px;font-size:11px}
.toggle-view{display:none}
.wscontent{flex:1;display:flex;overflow:hidden}
.editor{flex:1;overflow-y:auto;padding:16px 20px}
.preview{flex:1;overflow-y:auto;padding:20px;background:var(--sf2)}
.empty-state{display:flex;align-items:center;justify-content:center;height:100%;color:var(--tx3);font-size:14px;text-align:center;padding:20px}
.edsection{margin-bottom:20px}
.edsection h3{font-family:var(--dsp);font-size:14px;font-weight:700;margin-bottom:8px;color:var(--tx2);text-transform:uppercase;letter-spacing:.3px}
.edrow{display:flex;gap:8px;margin-bottom:6px}
.edrow>*{flex:1}
.edlabel{font-size:11px;font-weight:600;color:var(--tx2);margin-bottom:3px;display:block}
.edgroup{margin-bottom:6px}
.eitem{background:var(--sf2);border-radius:8px;padding:10px 12px;margin-bottom:6px;position:relative}
.eitem-head{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.eitem-name{font-weight:600;font-size:13px;flex:1}
.eitem-acts button{padding:2px 6px;font-size:11px;border-radius:4px;color:var(--tx2)}
.eitem-acts button:hover{background:var(--bd)}
.eitem-body{display:flex;gap:8px;align-items:end;flex-wrap:wrap}
.eitem-body .edgroup{flex:1;min-width:100px;margin-bottom:0}
.complexity{display:flex;gap:4px;margin-top:4px}
.complexity button{padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;background:var(--sf);border:1px solid var(--bd)}
.complexity button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.inclusions{font-size:11px;color:var(--tx2);margin-top:4px;line-height:1.5}
.add-row{display:flex;gap:6px;margin-top:8px}
.add-row select{flex:1;font-size:12px}
.type-sel{display:flex;gap:6px;margin-bottom:12px}
.type-btn{flex:1;padding:10px;border-radius:8px;font-weight:600;font-size:13px;text-align:center;background:var(--sf2);border:2px solid transparent;transition:all .15s}
.type-btn:hover{border-color:var(--bd)}
.type-btn.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 8%,var(--sf))}
.catalog{padding:20px;overflow-y:auto;flex:1}
.catalog h2{font-family:var(--dsp);font-size:18px;margin-bottom:12px}
.cat-notice{background:color-mix(in srgb,var(--orange) 12%,transparent);border-radius:8px;padding:10px 14px;font-size:12px;margin-bottom:16px;line-height:1.5}
.cat-section{margin-bottom:24px}
.cat-section h3{font-family:var(--dsp);font-size:15px;margin-bottom:8px;color:var(--brand)}
.cat-pkg{background:var(--sf2);border-radius:8px;padding:12px;margin-bottom:6px}
.paper{background:#fff;color:#222;max-width:720px;margin:0 auto;border-radius:4px;box-shadow:0 1px 6px rgba(0,0,0,.1);padding:48px 52px;font-family:var(--font);font-size:13px;line-height:1.6}
.paper-print{box-shadow:none;border-radius:0;margin:0;max-width:none}
.paper h1{font-family:var(--dsp);font-size:24px;color:var(--brand);margin:0}
.paper h2{font-family:var(--dsp);font-size:16px;margin:20px 0 8px;color:#333}
.paper-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px;padding-bottom:16px;border-bottom:2px solid var(--brand)}
.paper-header-left{display:flex;align-items:center;gap:12px}
.paper-badge{width:44px;height:44px;border-radius:50%;background:var(--brand2);display:flex;align-items:center;justify-content:center}
.paper-badge-ring{width:35px;height:35px;border-radius:50%;border:2px solid #fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
.paper-badge-ring span{font-family:var(--dsp);font-weight:800;font-size:8px;color:#fff;letter-spacing:.5px}
.paper-right{text-align:right;font-size:12px;color:#555}
.paper-right strong{display:block;font-size:13px;color:#222}
.pp-cols{display:flex;gap:24px;margin-bottom:20px}
.pp-col{flex:1}
.pp-label{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#888;margin-bottom:2px;font-weight:600}
.pp-strong{font-weight:600;font-size:14px}
.pp-table{width:100%;border-collapse:collapse;margin:12px 0}
.pp-table th{text-align:left;padding:8px 10px;background:#f8f8fa;font-size:11px;text-transform:uppercase;letter-spacing:.3px;color:#555;border-bottom:2px solid #e5e5e7}
.pp-table td{padding:8px 10px;border-bottom:1px solid #f0f0f2;font-size:13px;vertical-align:top}
.pp-table .tr{text-align:right}
.pp-total-box{background:var(--brand2);color:#fff;border-radius:8px;padding:14px 18px;margin:12px 0;display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:700;font-family:var(--dsp)}
.pp-sub-row{display:flex;justify-content:space-between;padding:4px 0;font-size:13px}
.pp-sub-row.discount{color:var(--green)}
.pp-steps{counter-reset:step}
.pp-steps li{list-style:none;padding:6px 0 6px 28px;position:relative;font-size:13px}
.pp-steps li::before{counter-increment:step;content:counter(step);position:absolute;left:0;top:6px;width:20px;height:20px;border-radius:50%;background:var(--brand2);color:#fff;text-align:center;line-height:20px;font-size:10px;font-weight:700}
.pp-terms{font-size:12px;color:#555;line-height:1.6}
.pp-terms{padding-left:18px}.pp-terms li{margin-bottom:6px;padding-left:2px}
.pp-pay{background:#f4f6ff;border-left:3px solid var(--brand);border-radius:6px;padding:10px 14px;margin:16px 0;font-size:12.5px;line-height:1.7}
.pp-sig{display:flex;gap:48px;margin-top:24px}
.pp-sig-line{flex:1;padding-top:36px;border-top:1px solid #ccc;font-size:11px;color:#888}
.pp-footer{margin-top:32px;padding-top:12px;border-top:1px solid #e5e5e7;font-size:11px;color:#888;display:flex;gap:16px;flex-wrap:wrap}
.pp-payment-row{display:flex;justify-content:space-between;padding:4px 8px;font-size:12px;background:#f8f8fa;border-radius:4px;margin-bottom:2px}
.pp-receipt-box{border:2px solid var(--green);border-radius:8px;padding:20px;text-align:center;margin:16px 0}
.pp-receipt-amount{font-family:var(--dsp);font-size:28px;font-weight:700;color:var(--green)}
.avoid-break{break-inside:avoid}
.thread-wrap{max-width:720px;width:100%;margin:20px auto 0}
.log-day{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--tx3);margin:18px 0 8px}
.log-day:first-child{margin-top:0}
.log-row{display:flex;gap:10px;padding:10px 12px;border-radius:8px;background:var(--sf);border:1px solid var(--bd);margin-bottom:6px;align-items:flex-start}
.thread .log-row{background:var(--sf2);border-color:transparent}
.log-ico{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;background:var(--sf2)}
.thread .log-ico{background:var(--sf)}
.log-main{flex:1;min-width:0;font-size:13px}
.log-meta{font-size:11px;color:var(--tx3);margin-top:2px}
.log-doc{font-weight:700;color:var(--brand);cursor:pointer}
.activity-view{flex:1;overflow-y:auto;padding:16px 24px;max-width:860px}
[hidden]{display:none!important}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal-box{background:var(--sf);border-radius:12px;max-width:560px;width:100%;max-height:80vh;display:flex;flex-direction:column}
.modal-head{padding:14px 18px;border-bottom:1px solid var(--bd);font-weight:700;font-family:var(--dsp);display:flex;justify-content:space-between;align-items:center}
.modal-body{padding:18px;overflow-y:auto;flex:1}
.modal-body textarea{min-height:200px;font-size:13px}
.modal-foot{padding:12px 18px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:500;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
@media(max-width:1280px){.toggle-view{display:flex}.wscontent .preview{display:none}.wscontent.show-preview .editor{display:none}.wscontent.show-preview .preview{display:flex;flex-direction:column}}
@media(max-width:900px){.sidebar{width:240px}}
@media(max-width:768px){.menu-btn{display:flex}.userchip .uname,#sync{display:none}.sidebar{position:fixed;left:-280px;top:48px;bottom:0;z-index:50;width:280px;transition:left .2s}.sidebar.open{left:0}}
@media print{.topbar,.sidebar,.wsbar,.editor,.modal,.toast,#pdfHost{display:none!important}.wscontent{display:block!important}.preview{display:block!important;padding:0!important;background:#fff!important;overflow:visible!important}.paper{box-shadow:none!important;padding:24px 32px!important;max-width:none!important}body{height:auto!important;overflow:visible!important}}
/* clean document layout */
.pp-table td strong{font-size:14px}
.pp-scope{display:grid;grid-template-columns:1fr 1fr;gap:12px 28px;margin:10px 0 4px}
.pp-scope-g{break-inside:avoid}
.pp-scope-h{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--brand);margin-bottom:4px}
.pp-scope ul,.pp-desc{margin:0;padding-left:16px;font-size:12px;color:#444;line-height:1.6}
div.pp-desc{padding-left:0;margin-top:6px}
ul.pp-desc{margin-top:6px}
.pp-pay{margin:20px 0;background:none;border:none;padding:0}
.pp-pay-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:6px}
.pp-pay-card{border:1px solid #e3e6f5;border-radius:8px;padding:10px 14px;background:#f8f9ff}
.pp-pay-m{font-weight:700;font-size:13px;color:#222;margin-bottom:6px}
.pp-pay-r{display:flex;justify-content:space-between;gap:12px;font-size:12px;padding:2px 0}
.pp-pay-r span{color:#888}
.pp-pay-r b{font-weight:600;color:#222;font-variant-numeric:tabular-nums}
.pp-terms{columns:2;column-gap:28px;padding-left:16px;font-size:11px;line-height:1.5;color:#555}
.pp-terms li{margin-bottom:5px;break-inside:avoid;padding-left:0}
.pp-item.has-more td{border-bottom:none;padding-bottom:2px}
.pp-item-more td{padding-top:0;padding-bottom:14px}
.pp-scope{grid-template-columns:repeat(3,1fr)}
.pp-footer{margin-top:28px;padding-top:10px;border-top:1px solid #eceef3;font-size:9.5px;color:#8a8f9c;display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.pp-footer span{display:inline-flex;align-items:center;gap:5px}
.pp-footer svg{width:11px;height:11px;fill:none;stroke:var(--brand);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.pp-sig{margin-top:36px}
.pp-sig-line{padding-top:6px}
.pp-sig{display:flex;gap:48px;margin-top:32px}
.pp-sig-col{flex:1;display:flex;flex-direction:column;min-width:0}
.pp-sig-space{height:70px;display:flex;align-items:flex-end}
.pp-sig-img{height:76px;margin:0 0 -5px 10px;pointer-events:none}
.pp-sig-line{flex:none;border-top:1px solid #bbb;padding-top:6px;margin-top:0;font-size:10.5px;color:#888;display:flex;flex-direction:column;gap:1px}
.pp-sig-line b{font-size:12.5px;color:#222;font-weight:600}
/* A4 pages */
.pages{display:flex;flex-direction:column;align-items:center;gap:20px;padding:4px 0 20px;width:794px;margin:0 auto}
.paper.a4-page{width:794px;height:1123px;max-width:none;margin:0;padding:52px 56px 0;border-radius:2px;position:relative;overflow:hidden;flex-shrink:0;box-shadow:0 1px 8px rgba(0,0,0,.12)}
.paper.a4-page.paper-print{box-shadow:none;border-radius:0}
.a4-body>:first-child{margin-top:0}
.a4-foot{position:absolute;left:56px;right:56px;bottom:30px;border-top:1px solid #eceef3;padding-top:10px;display:flex;align-items:center}
.a4-foot-c{flex:1;display:flex;justify-content:center;gap:18px;flex-wrap:wrap;font-size:9.5px;color:#8a8f9c}
.a4-foot-c span{display:inline-flex;align-items:center;gap:5px}
.a4-foot-c svg{width:11px;height:11px;fill:none;stroke:var(--brand);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.a4-pg{font-size:9.5px;color:#8a8f9c;white-space:nowrap;margin-left:12px}
#preview{align-items:center}
/* scope: one row per group, items in two even columns */
.pp-scope{display:block;margin:4px 0 0}
.pp-scope-g{display:grid;grid-template-columns:118px 1fr;column-gap:14px;padding:7px 0;border-top:1px solid #f0f1f5}
.pp-scope-g:first-child{border-top:none;padding-top:2px}
.pp-scope-h{margin:2px 0 0;line-height:1.6}
.pp-scope ul{display:block;columns:2;column-gap:22px;padding-left:0;list-style:none;margin:0}
.pp-scope li{break-inside:avoid}
.pp-scope li{position:relative;padding-left:12px}
.pp-scope li::before{content:'';position:absolute;left:1px;top:.68em;width:4px;height:4px;border-radius:50%;background:var(--brand)}
@media print{@page{size:A4;margin:0}html,body{background:#fff!important}.pages{zoom:1!important;gap:0;padding:0;width:auto}.paper.a4-page{box-shadow:none!important;border-radius:0;padding:52px 56px 0!important;width:794px!important;max-width:none!important;margin:0!important}.paper.a4-page+.paper.a4-page{break-before:page}.thread-wrap{display:none!important}.preview{padding:0!important}}
/* printing uses its own clean container, so the app layout can't shift or crop it */
#printHost{display:none}
@media print{
 @page{size:A4;margin:0}
 html,body.printing{display:block!important;height:auto!important;min-height:0!important;overflow:visible!important;margin:0!important;padding:0!important;background:#fff!important}
 body.printing>*:not(#printHost){display:none!important}
 body.printing #printHost{display:block!important;position:static!important;width:auto!important}
 #printHost .paper.a4-page{display:block!important;position:relative!important;width:210mm!important;height:296.5mm!important;max-width:none!important;margin:0!important;padding:52px 56px 0!important;box-shadow:none!important;border-radius:0!important;overflow:hidden!important;zoom:1!important;break-after:page;page-break-after:always}
 #printHost .paper.a4-page:last-child{break-after:auto;page-break-after:auto}
}
.mpick{display:flex;flex-wrap:wrap;gap:6px}
.mopt{padding:7px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--sf);font-weight:600;font-size:13px}
.mopt:hover{border-color:var(--brand)}
.mopt.on{background:var(--brand);border-color:var(--brand);color:#fff}
</style>

<body>
<div class="login" id="login" hidden>
  <button class="iconbtn login-theme themeBtn" onclick="toggleTheme()" title="Light / dark mode">🌙</button>
  <div class="login-card">
    <img class="ccc-logo" alt="Cosmic Cat" style="width:72px;height:72px">
    <h1>Cosmic Cat Creatives</h1>
    <p>Proposals, invoices and receipts</p>
    <form id="loginForm" onsubmit="doSignIn(event)">
      <div class="edgroup"><label class="edlabel" for="loginEmail">Email</label><input id="loginEmail" type="email" autocomplete="username" required></div>
      <div class="edgroup"><label class="edlabel" for="loginPw">Password</label><input id="loginPw" type="password" autocomplete="current-password" required></div>
      <div class="login-err" id="loginErr"></div>
      <button class="btn btn-brand" type="submit" id="loginBtn">Sign in</button>
    </form>
    <button class="login-link" id="forgotBtn" onclick="forgotPw()">Forgot password?</button>
    <div class="login-note" id="loginNote" hidden></div>
  </div>
</div>
<div class="topbar">
  <button class="iconbtn menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')" title="Menu">☰</button>
  <a href="../" title="Cosmic Cat home" style="display:flex;align-items:center;gap:8px;color:inherit;text-decoration:none"><img class="ccc-logo" alt="Cosmic Cat" style="width:34px;height:34px;flex-shrink:0"><span class="logo">Cosmic Cat</span></a>
  <button class="tab on" data-mod="proposals">Proposals<span class="tcount" id="tcProp"></span></button>
  <button class="tab" data-mod="invoices">Invoices<span class="tcount" id="tcInv"></span></button>
  <button class="tab" data-mod="receipts">Receipts<span class="tcount" id="tcRec"></span></button>
  <button class="tab" data-mod="settings">Settings</button>
  <button class="tab" data-mod="activity">Activity</button>
  <a class="tab" href="../leads/" style="text-decoration:none;color:inherit;opacity:.75" title="Open the Lead Board">Lead Board ↗</a>
  <div class="tbr"><span id="sync"></span><button class="iconbtn themeBtn" onclick="toggleTheme()" title="Light / dark mode">🌙</button><button class="userchip" id="userChip" onclick="openProfile()" title="Your name"></button><button class="btn btn-outline btn-sm" onclick="signOut()">Sign out</button></div>
</div>
<div class="main">
  <div class="sidebar" id="sidebar"></div>
  <div class="workspace">
    <div class="wsbar" id="wsbar"></div>
    <div class="wscontent" id="wscontent"></div>
  </div>
</div>
<div class="modal" id="modal" hidden></div>
